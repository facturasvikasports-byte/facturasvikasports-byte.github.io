<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fotos">
<title>Fotos</title>
<style>
  :root { --fondo:#0b0b0c; --texto:#f2f2f2; --suave:#9a9aa0; --acento:#7ed321; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--fondo); color:var(--texto);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  body { overscroll-behavior:none; -webkit-user-select:none; user-select:none; }
  header { position:sticky; top:0; z-index:5; display:flex; align-items:center;
    justify-content:space-between; padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
    background:rgba(11,11,12,.92); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  header h1 { margin:0; font-size:20px; font-weight:600; }
  #contador { color:var(--suave); font-size:15px; }
  #rejilla { display:grid; gap:4px; padding:4px; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); }
  #rejilla button { all:unset; display:block; aspect-ratio:2/3; background:#1b1b1e; overflow:hidden;
    border-radius:4px; cursor:pointer; content-visibility:auto; contain-intrinsic-size:180px 270px; }
  #rejilla img { width:100%; height:100%; object-fit:cover; display:block; opacity:0; transition:opacity .25s; }
  #rejilla img.lista { opacity:1; }
  #vacio { text-align:center; color:var(--suave); padding:80px 20px; font-size:18px; }
  #aviso { position:fixed; left:50%; top:calc(64px + env(safe-area-inset-top)); transform:translate(-50%,-20px);
    background:var(--acento); color:#111; font-weight:600; padding:10px 18px; border-radius:999px;
    opacity:0; transition:.3s; z-index:6; pointer-events:none; }
  #aviso.ver { opacity:1; transform:translate(-50%,0); pointer-events:auto; }

  /* Visor a pantalla completa */
  #visor { position:fixed; inset:0; background:#000; z-index:10; display:none; touch-action:none; overflow:hidden; }
  #visor.abierto { display:block; }
  #pista { position:absolute; inset:0; display:flex; will-change:transform; }
  .panel { flex:0 0 100%; height:100%; display:flex; align-items:center; justify-content:center; }
  .panel img { max-width:100%; max-height:100%; object-fit:contain; display:block; }
  #cerrar, #posicion { position:absolute; z-index:2; color:#fff; background:rgba(0,0,0,.45);
    border:0; border-radius:999px; font-size:17px; padding:10px 16px;
    top:calc(12px + env(safe-area-inset-top)); }
  #cerrar { left:12px; font-weight:600; }
  #posicion { right:12px; }
  .flecha { position:absolute; top:50%; transform:translateY(-50%); z-index:2; border:0;
    background:rgba(0,0,0,.35); color:#fff; font-size:34px; width:56px; height:84px; border-radius:12px; }
  #anterior { left:8px; } #siguiente { right:8px; }
  @media (hover:none) { .flecha { display:none; } }
</style>
</head>
<body>
<header><h1>Fotos</h1><span id="contador"></span></header>
<div id="aviso">Nuevas fotos ↑</div>
<main id="rejilla"></main>
<div id="vacio">Esperando fotos…</div>

<div id="visor">
  <div id="pista">
    <div class="panel"><img alt=""></div>
    <div class="panel"><img alt=""></div>
    <div class="panel"><img alt=""></div>
  </div>
  <button id="cerrar">✕ Cerrar</button>
  <span id="posicion"></span>
  <button class="flecha" id="anterior">‹</button>
  <button class="flecha" id="siguiente">›</button>
</div>

<script>
(() => {
  const PRECARGA_ADELANTE = 5, PRECARGA_ATRAS = 2;
  let lista = [], version = -1, actual = -1, abierto = false;
  const $ = s => document.querySelector(s);
  const rejilla = $('#rejilla'), visor = $('#visor'), pista = $('#pista');
  const paneles = [...pista.querySelectorAll('img')];
  const urlVista = f => '/v/' + f.id + '.jpg';
  const urlMini  = f => '/m/' + f.id + '.jpg';

  // ---------- Precarga: deja las fotos descargadas Y decodificadas ----------
  const cache = new Map();
  function precargar(f) {
    if (!f || cache.has(f.id)) return;
    const img = new Image();
    img.src = urlVista(f);
    img.decode().catch(() => {});
    cache.set(f.id, img);
  }
  function precargarAlrededor() {
    for (let d = 1; d <= PRECARGA_ADELANTE; d++) precargar(lista[actual + d]);
    for (let d = 1; d <= PRECARGA_ATRAS; d++) precargar(lista[actual - d]);
    // Liberar memoria de fotos lejanas (el navegador las conserva en su caché de disco)
    const cerca = new Set();
    for (let d = -PRECARGA_ATRAS - 2; d <= PRECARGA_ADELANTE + 2; d++) lista[actual + d] && cerca.add(lista[actual + d].id);
    for (const id of cache.keys()) if (!cerca.has(id)) cache.delete(id);
  }

  // ---------- Rejilla ----------
  function pintarRejilla() {
    $('#vacio').style.display = lista.length ? 'none' : 'block';
    $('#contador').textContent = lista.length ? lista.length + ' fotos' : '';
    const existentes = new Map([...rejilla.children].map(b => [b.dataset.id, b]));
    const frag = document.createDocumentFragment();
    lista.forEach((f, i) => {
      let b = existentes.get(f.id);
      if (!b) {
        b = document.createElement('button');
        b.dataset.id = f.id;
        const img = document.createElement('img');
        img.loading = 'lazy'; img.decoding = 'async'; img.alt = '';
        img.onload = () => img.classList.add('lista');
        img.src = urlMini(f);
        b.appendChild(img);
      }
      frag.appendChild(b);
    });
    rejilla.replaceChildren(frag);
  }
  rejilla.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b) abrir(lista.findIndex(f => f.id === b.dataset.id));
  });

  // ---------- Consulta de fotos nuevas ----------
  async function actualizar() {
    try {
      const r = await fetch('/api/fotos', { cache: 'no-store' });
      const d = await r.json();
      if (d.version !== version) {
        const habia = lista.length, idActual = lista[actual]?.id;
        const nuevas = version >= 0 && d.fotos.length > habia;
        version = d.version; lista = d.fotos;
        pintarRejilla();
        if (abierto) {
          const i = lista.findIndex(f => f.id === idActual);
          if (i < 0) cerrar(); else { actual = i; colocar(); }
        } else if (nuevas && window.scrollY > 200) {
          $('#aviso').classList.add('ver');
          setTimeout(() => $('#aviso').classList.remove('ver'), 4000);
        }
      }
    } catch (e) { /* sin conexión momentánea: se reintenta */ }
  }
  $('#aviso').onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
  actualizar();
  setInterval(actualizar, 3000);

  // ---------- Visor con deslizamiento ----------
  // Tres paneles (anterior, actual, siguiente) ya cargados: el cambio es inmediato.
  function ponerImagen(img, f) {
    if (!f) { img.removeAttribute('src'); img.style.visibility = 'hidden'; return; }
    img.style.visibility = 'visible';
    const u = urlVista(f);
    if (!img.src.endsWith(u)) img.src = u;
  }
  function colocar() {
    ponerImagen(paneles[0], lista[actual - 1]);
    ponerImagen(paneles[1], lista[actual]);
    ponerImagen(paneles[2], lista[actual + 1]);
    mover(0, false);
    $('#posicion').textContent = (actual + 1) + ' / ' + lista.length;
    precargarAlrededor();
  }
  function mover(dx, animar) {
    pista.style.transition = animar ? 'transform .22s cubic-bezier(.2,.7,.3,1)' : 'none';
    pista.style.transform = `translate3d(calc(-100% + ${dx}px),0,0)`;
  }
  function abrir(i) {
    if (i < 0) return;
    actual = i; abierto = true;
    visor.classList.add('abierto');
    document.body.style.overflow = 'hidden';
    colocar();
  }
  function cerrar() {
    abierto = false;
    visor.classList.remove('abierto');
    document.body.style.overflow = '';
    const b = rejilla.querySelector(`[data-id="${lista[actual]?.id}"]`);
    b && b.scrollIntoView({ block: 'center' });
  }
  let animando = false;
  function ir(paso) {
    const destino = actual + paso;
    if (animando) return;
    if (destino < 0 || destino >= lista.length) { mover(0, true); return; }
    animando = true;
    pista.style.transition = 'transform .22s cubic-bezier(.2,.7,.3,1)';
    pista.style.transform = `translate3d(${paso > 0 ? '-200%' : '0%'},0,0)`;
    setTimeout(() => { actual = destino; colocar(); animando = false; }, 230);
  }

  let x0 = null, y0 = 0, dx = 0, t0 = 0;
  visor.addEventListener('touchstart', e => {
    if (e.target.closest('button') || e.touches.length > 1 || animando) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; t0 = Date.now();
  }, { passive: true });
  visor.addEventListener('touchmove', e => {
    if (x0 === null) return;
    dx = e.touches[0].clientX - x0;
    const sinMas = (dx > 0 && actual === 0) || (dx < 0 && actual === lista.length - 1);
    mover(sinMas ? dx / 3 : dx, false);
  }, { passive: true });
  visor.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dy = e.changedTouches[0].clientY - y0;
    const rapido = Math.abs(dx) > 30 && Date.now() - t0 < 250;
    x0 = null;
    if (Math.abs(dx) > visor.clientWidth * 0.18 || rapido) ir(dx < 0 ? 1 : -1);
    else if (dy > 120 && Math.abs(dx) < 60) cerrar();   // deslizar hacia abajo cierra
    else mover(0, true);
  });

  $('#cerrar').onclick = cerrar;
  $('#anterior').onclick = () => ir(-1);
  $('#siguiente').onclick = () => ir(1);
  document.addEventListener('keydown', e => {
    if (!abierto) return;
    if (e.key === 'ArrowRight') ir(1);
    if (e.key === 'ArrowLeft') ir(-1);
    if (e.key === 'Escape') cerrar();
  });
  // Evitar el zoom por doble toque de Safari en el visor
  visor.addEventListener('dblclick', e => e.preventDefault());
})();
</script>
</body>
</html>
